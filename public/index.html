<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LocalGPT Code Chat</title>
  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css" />
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <!-- Highlight.js for syntax highlighting (optional) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark.min.css"
  />
</head>
<body>
  <a href="#chatbox" class="skip-link">Skip to chat messages</a>
  <!-- Container for sidebar + chat area -->
  <div class="container">
    <!-- Sidebar (new design) -->
    <aside class="sidebar" role="navigation" aria-label="Sidebar">
      <!-- Top controls -->
      <header class="sidebar-top">
        <button id="toggleSidebar" class="collapse-btn" aria-label="Collapse sidebar">☰</button>
        <input id="sidebarSearch" class="sidebar-search" type="search" placeholder="Search…" aria-label="Search conversations" />
      </header>

      <!-- Chats Section -->
      <section class="sidebar-section">
        <div class="section-header">
          <h3>Chats</h3>
          <button class="new-chat-btn" onclick="startNewChat()" aria-label="Start new chat">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18px" height="18px">
              <path fill-rule="evenodd" d="M12 3.75a.75.75 0 01.75.75v6.75h6.75a.75.75 0 010 1.5h-6.75v6.75a.75.75 0 01-1.5 0v-6.75H4.5a.75.75 0 010-1.5h6.75V4.5a.75.75 0 01.75-.75z" clip-rule="evenodd" />
            </svg>
            <span>New Chat</span>
          </button>
        </div>
        <nav id="conversation-list" class="conversation-list"></nav>
      </section>

      <!-- Footer -->
      <footer class="sidebar-footer">
        <div class="user-card">
          <div class="avatar-sm">NE</div>
          <span class="username">Neel Sharma</span>
        </div>
      </footer>
    </aside>

    <!-- Main chat area -->
    <main class="chat-area" role="main">
      <!-- Greeting (top) -->
      <header class="greeting">
        <h1>Good Evening, Neel.</h1>
        <h2>How can I help you today?</h2>
      </header>

      <!-- Chat messages -->
      <div id="chatbox" class="chatbox" role="log" aria-live="polite" aria-label="Chat messages"></div>

      <!-- Input bar (pinned at bottom) -->
      <div class="input-bar">
        <textarea
          id="input"
          rows="1"
          aria-label="Type your message"
          placeholder="Type your message"
        ></textarea>
        <button id="send" aria-label="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20px" height="20px">
            <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" />
          </svg>
        </button>
      </div>
    </main>
  </div>
  <!-- Sidebar Reopen Button -->
  <button id="reopenSidebar" class="reopen-sidebar" aria-label="Open sidebar">☰</button>

  <!-- Highlight.js script (optional) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

  <!-- Main script -->
  <script src="script.js"></script>
</body>
</html>
